# ==============================================================================
# StudySync Application Configuration
# ==============================================================================

# Database Configuration (MySQL 8)
db.url=jdbc:mysql://localhost:3306/studysync?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# File Storage Configuration (Files stored OUTSIDE webapp root for security)
# Default path resolves to <user.home>/studysync-uploads/notes
upload.dir=studysync-uploads
upload.maxBytes=10485760

# Application Details
app.name=StudySync
app.version=1.0.0
